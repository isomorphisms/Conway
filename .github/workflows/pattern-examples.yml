name: Pattern examples

on:
  pull_request:
    paths:
      - '.github/workflows/pattern-examples.yml'
      - 'pattern-language/**'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pattern-examples.yml'
      - 'pattern-language/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pattern language tests
        run: node --test pattern-language/tests/pattern.test.mjs
